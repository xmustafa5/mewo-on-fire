<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mewo Session</title>
<!--
  The chat of a Mewo Session window: Claude Code's conversation drawn the way
  the Claude Code extension draws it (messages, tool calls with their input
  and output, diffs, questions and permission prompts as buttons, a composer
  with the mode and the model). The window (mewo-session) runs Claude Code in
  its stream mode, hands every event to mewo.recv([...]) and takes what the
  page posts to window.webkit.messageHandlers.mewo (JSON text):
    {t:'ready'} {t:'send',text,images} {t:'respond',request_id,response}
    {t:'interrupt'} {t:'set_model',model} {t:'set_mode',mode}
    {t:'open',path,line} {t:'url',url} {t:'copy',text} {t:'files',q} {t:'state',state}
  Everything Claude writes is escaped before it reaches the page.
-->
<style>
:root {
  color-scheme: dark;
  --bg: #1e2227; --surface: #1e1f23; --line: #181a1f; --line2: #2f333b;
  --text: #cccccc; --text2: #acb2bf; --dim: #7f848e; --dim2: #5c6370;
  --accent: #f48771; --chip: #2f3034; --code-bg: #363a3f; --code: #d19a66;
  --ok: #89ca78; --err: #ef596f; --warn-bg: #534635; --warn: #d8b88b; --link: #61afef;
  --add: rgba(137, 202, 120, .14); --del: rgba(239, 89, 111, .14);
  --sans: system-ui, -apple-system, "Segoe UI", Ubuntu, "Droid Sans", sans-serif;
  --mono: "Droid Sans Mono", "Ubuntu Mono", "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
::selection { background: rgba(97, 175, 239, .35); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(172, 178, 191, .18); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(172, 178, 191, .35); background-clip: content-box; border: 2px solid transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
code { font-family: var(--mono); font-size: .92em; background: var(--code-bg); color: var(--code); padding: 1px 5px; border-radius: 4px; }
code.path { cursor: pointer; } code.path:hover { text-decoration: underline; }
pre { margin: 0; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }

#log { flex: 1; min-height: 84px; overflow-y: auto; padding: 12px 20px 6px; }
#inner { max-width: 1180px; margin: 0 auto; }

/* The empty chat. */
#hello { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16vh 0 0; color: var(--dim); text-align: center; }
#hello .mark { font-size: 34px; color: var(--accent); line-height: 1; }
#hello .t { font-size: 15px; color: var(--text); font-weight: 600; }

/* What you sent: a box across the chat, the time above it. */
.u { margin: 16px 0 10px; }
.u .time { text-align: right; font-size: 11px; color: var(--dim); margin: 0 2px 3px; }
.u .time .q { color: var(--warn); margin-right: 8px; letter-spacing: .04em; }
.u .bub { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; color: var(--text2); white-space: pre-wrap; word-break: break-word; }
.u .bub.clamp { max-height: 9.4em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); }
.u .imgs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; } .u .imgs img { max-height: 110px; max-width: 220px; border-radius: 4px; border: 1px solid var(--line2); }
.more { background: none; border: 0; color: var(--dim); font-size: 12px; padding: 2px 0; } .more:hover { color: var(--text); }

/* What Claude does: a row with a dot in the gutter. */
.row { position: relative; padding-left: 26px; margin: 9px 0; min-width: 0; }
.row::before { content: ''; position: absolute; left: 9px; top: .56em; width: 7px; height: 7px; border-radius: 50%; background: var(--dim2); }
.row.a::before { background: var(--text2); }
.row.tool[data-state="run"]::before { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.row.tool[data-state="ok"]::before { background: var(--ok); }
.row.tool[data-state="err"]::before { background: var(--err); }
.row.tool[data-state="stop"]::before { background: var(--dim2); }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }

/* Markdown. */
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 8px; } .md ul, .md ol { margin: 0 0 8px; padding-left: 22px; } .md li { margin: 2px 0; } .md li > ul, .md li > ol { margin: 2px 0; }
.md h1, .md h2, .md h3, .md h4 { margin: 14px 0 6px; line-height: 1.3; color: #e2e4e8; } .md h1 { font-size: 17px; } .md h2 { font-size: 15px; } .md h3, .md h4 { font-size: 13.5px; }
.md strong { color: #e2e4e8; font-weight: 600; } .md hr { border: 0; border-top: 1px solid var(--line2); margin: 12px 0; }
.md blockquote { margin: 0 0 8px; padding: 2px 12px; border-left: 3px solid var(--line2); color: var(--text2); }
.md table { border-collapse: collapse; margin: 4px 0 10px; font-size: 12.5px; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line2); padding: 4px 9px; text-align: left; vertical-align: top; } .md th { background: var(--surface); color: var(--text2); font-weight: 600; }
.md input[type=checkbox] { margin: 0 6px 0 -18px; vertical-align: -2px; }
.code { border: 1px solid var(--line2); border-radius: 6px; background: var(--surface); margin: 4px 0 10px; overflow: hidden; }
.code .ch { display: flex; align-items: center; justify-content: space-between; padding: 3px 6px 3px 10px; border-bottom: 1px solid var(--line2); color: var(--dim); font-size: 11px; }
.code .ch button { background: none; border: 0; color: var(--dim); font-size: 11px; padding: 1px 6px; border-radius: 4px; } .code .ch button:hover { color: var(--text); background: var(--chip); }
.code pre { padding: 8px 10px; overflow-x: auto; white-space: pre; word-break: normal; color: var(--text2); }
.code pre code { background: none; color: inherit; padding: 0; font-size: 12px; }

/* A tool call. */
.th { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.th b { font-weight: 600; color: #e2e4e8; flex: none; }
.th .sum { color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.th .sum code { background: none; color: var(--text2); padding: 0; }
.th .meta { color: var(--dim2); font-size: 12px; flex: none; }
.th .tog { background: none; border: 0; color: var(--dim2); padding: 0 4px; font-size: 11px; flex: none; } .th .tog:hover { color: var(--text); }
.tb { margin-top: 5px; } .tb[hidden] { display: none; }
.io { border: 1px solid var(--line2); border-radius: 6px; background: var(--surface); overflow: hidden; }
.io .r { display: grid; grid-template-columns: 40px minmax(0, 1fr); } .io .r + .r { border-top: 1px solid var(--line2); } .io .r[hidden] { display: none; }
.io .k { padding: 6px 0 6px 10px; color: var(--dim2); font: 11px/1.65 var(--mono); }
.io .v { padding: 6px 10px 6px 0; color: var(--text2); min-width: 0; }
.io .v.err { color: var(--err); } .io .v .none { color: var(--dim2); }
.clampy { max-height: 13.6em; overflow: hidden; } .clampy.open { max-height: none; }
.diff { border: 1px solid var(--line2); border-radius: 6px; background: var(--surface); overflow: hidden; font: 12px/1.5 var(--mono); }
.diff .fn { padding: 4px 10px; border-bottom: 1px solid var(--line2); color: var(--text2); font: 12px var(--sans); display: flex; gap: 8px; }
.diff .fn .st { color: var(--dim2); margin-left: auto; } .diff .fn .st .p { color: var(--ok); } .diff .fn .st .m { color: var(--err); }
.diff .ls { overflow-x: auto; } .diff .ln { white-space: pre; padding: 0 10px 0 0; min-width: max-content; }
.diff .ln::before { content: attr(data-s); display: inline-block; width: 22px; text-align: center; color: var(--dim2); }
.diff .ln.add { background: var(--add); } .diff .ln.del { background: var(--del); } .diff .ln.add::before { color: var(--ok); } .diff .ln.del::before { color: var(--err); }
.diff .ln.gap { color: var(--dim2); }
.todos { list-style: none; margin: 0; padding: 0; } .todos li { display: flex; gap: 8px; padding: 1px 0; color: var(--text2); }
.todos li::before { content: '☐'; color: var(--dim); } .todos li.completed { color: var(--dim2); text-decoration: line-through; } .todos li.completed::before { content: '☑'; color: var(--ok); }
.todos li.in_progress { color: #e2e4e8; font-weight: 600; } .todos li.in_progress::before { content: '◐'; color: var(--accent); }
.nest { margin: 6px 0 0; padding-left: 2px; border-left: 1px solid var(--line2); } .nest .row { margin: 6px 0; }
.think { color: var(--dim); font-style: italic; } .think .tx { white-space: pre-wrap; margin-top: 4px; } .think summary { cursor: pointer; list-style: none; } .think summary::-webkit-details-marker { display: none; }
.note { color: var(--dim); font-size: 12px; margin: 8px 0 8px 26px; } .note.err { color: var(--err); white-space: pre-wrap; } .note.sep { display: flex; align-items: center; gap: 10px; margin-left: 0; } .note.sep::before, .note.sep::after { content: ''; flex: 1; border-top: 1px solid var(--line2); }
#spin { display: none; align-items: baseline; gap: 8px; margin: 12px 0 8px 5px; color: var(--accent); } #spin.on { display: flex; }
#spin .g { width: 15px; text-align: center; font-size: 14px; } #spin .v { color: var(--accent); } #spin .s { color: var(--dim2); font-size: 12px; }
#jump { position: absolute; right: 26px; top: -40px; width: 30px; height: 30px; border-radius: 50%; background: var(--chip); border: 1px solid var(--line2); color: var(--text2); } #jump[hidden] { display: none; }

/* The dock: the limit banner, a prompt waiting for you, or the composer. */
#dock { padding: 4px 20px 14px; } #dock-in { max-width: 760px; margin: 0 auto; position: relative; }
#banner { background: var(--warn-bg); border: 1px solid var(--warn); border-bottom: 0; border-radius: 8px 8px 0 0; padding: 6px 12px; color: var(--warn); font-weight: 600; font-size: 12px; display: flex; gap: 8px; }
#banner[hidden] { display: none; } #banner button { margin-left: auto; background: none; border: 0; color: var(--warn); padding: 0 2px; }
#banner:not([hidden]) + #ask .card, #banner:not([hidden]) ~ #composer { border-top-left-radius: 0; border-top-right-radius: 0; }
#composer { background: var(--surface); border: 1px solid var(--line2); border-radius: 8px; }
#composer:focus-within { border-color: var(--accent); } #composer[hidden] { display: none; } #composer.off { opacity: .5; pointer-events: none; }
#input { display: block; width: 100%; background: none; border: 0; outline: 0; resize: none; color: var(--text); font: 13px/1.5 var(--sans); padding: 10px 12px 4px; max-height: 38vh; min-height: 34px; }
#input::placeholder { color: var(--dim2); }
#strip { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 10px 0; } #strip:empty { display: none; }
#strip .at { position: relative; } #strip img { height: 48px; border-radius: 4px; border: 1px solid var(--line2); display: block; }
#strip .at button { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; border: 0; background: var(--chip); color: var(--text); font-size: 10px; line-height: 1; padding: 0; }
.bar { display: flex; align-items: center; gap: 6px; padding: 4px 8px 8px; }
.ib { width: 26px; height: 26px; border-radius: 5px; background: none; border: 0; color: var(--text2); display: grid; place-items: center; padding: 0; } .ib:hover { background: var(--chip); }
.ib svg, #send svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.chip { background: var(--chip); color: var(--text2); border: 0; border-radius: 5px; padding: 3px 9px; font-size: 12px; white-space: nowrap; } .chip:hover { color: #fff; }
.chip.mode { background: none; display: flex; gap: 5px; align-items: center; margin-left: auto; } .chip.mode.hot { color: var(--accent); }
#send { width: 26px; height: 26px; border-radius: 6px; border: 0; background: var(--accent); color: var(--surface); display: grid; place-items: center; padding: 0; } #send:disabled { opacity: .35; cursor: default; } #send svg { stroke-width: 2.2; }
#send.stop { background: var(--chip); color: var(--text); } #send.stop svg { fill: currentColor; stroke: none; }
#pop { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line2); border-radius: 8px; padding: 4px; max-height: 300px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); z-index: 5; }
#pop[hidden] { display: none; } #pop.small { right: auto; min-width: 250px; }
#pop .it { display: flex; gap: 10px; align-items: baseline; padding: 5px 9px; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; }
#pop .it.on { background: var(--chip); } #pop .it .n { color: var(--text); overflow: hidden; text-overflow: ellipsis; } #pop .it .d { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; } #pop .it .ck { margin-left: auto; color: var(--accent); }
#pop .hd { padding: 4px 9px 2px; font-size: 11px; color: var(--dim2); }

/* A prompt waiting for you. */
#ask:empty { display: none; }
.card { background: var(--surface); border: 1px solid var(--accent); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; max-height: min(68vh, 660px); }
.card > * { flex: none; } .card .cd, .card .qbody { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
.card .ct { font-weight: 600; color: #e2e4e8; margin-bottom: 2px; } .card .cs { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
.card .cd { margin: 8px 0 10px; }
.card .q[hidden] { display: none; } .card .qbody { padding-right: 2px; } .card .qs { color: var(--dim); font-size: 12px; margin: -3px 0 6px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: -2px 0 10px; padding-bottom: 9px; border-bottom: 1px solid var(--line2); }
.tab { background: none; border: 0; border-radius: 5px; padding: 3px 10px 3px 8px; color: var(--dim); font-size: 12px; display: flex; gap: 7px; align-items: center; } .tab:hover { color: var(--text); }
.tab .tk { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--dim2); flex: none; } .tab.ok .tk { border-color: var(--ok); background: var(--ok); }
.tab.on { background: var(--chip); color: #e2e4e8; }
.tabs { align-items: center; } .tabs.one { border-bottom: 0; padding-bottom: 0; margin-bottom: 4px; min-height: 26px; } .tabs .qh { margin-bottom: 0; }
.copyq { margin-left: auto; flex: none; color: var(--dim); } .copyq:hover { color: var(--text); } .copyq.ok { color: var(--ok); }
.card .qh { display: inline-block; background: var(--chip); color: var(--text2); border-radius: 4px; padding: 0 7px; font-size: 11px; margin-bottom: 4px; }
.card .qt { color: #e2e4e8; font-weight: 600; margin-bottom: 6px; }
.opt { display: flex; gap: 0 9px; align-items: baseline; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; color: var(--text); }
.opt:hover, .opt.on { background: var(--chip); } .opt.on { border-color: var(--accent); }
.opt .k { color: var(--dim2); font: 11px var(--mono); flex: none; width: 12px; } .opt.on .k { color: var(--accent); }
.opt .l { font-weight: 600; flex: none; max-width: 100%; } .opt .ds { color: var(--dim); font-size: 12px; min-width: 0; }
.opt.col { flex-wrap: wrap; } .opt.col .ds { flex-basis: 100%; padding-left: 22px; }
.opt .mk { flex: none; align-self: center; width: 13px; height: 13px; border: 1.5px solid var(--dim); border-radius: 50%; position: relative; } .opt .mk.sq { border-radius: 3px; }
.opt.on .mk { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 42%, transparent 48%); }
.opt.on .mk.sq { background: var(--accent); } .opt.on .mk.sq::after { content: '✓'; position: absolute; left: 0; right: 0; top: -1.5px; font: 700 10px/13px var(--sans); text-align: center; color: var(--surface); }
.opt .kb { margin-left: auto; padding-left: 10px; color: var(--dim2); font: 11px var(--mono); flex: none; }
.card input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; color: var(--text); font: 13px var(--sans); padding: 6px 9px; outline: 0; margin-top: 6px; }
.card input[type=text]:focus { border-color: var(--accent); }
.card .pv { margin-top: 8px; border: 1px solid var(--line2); border-radius: 6px; padding: 8px 10px; background: var(--bg); max-height: 30vh; overflow: auto; } .card .pv:empty { display: none; }
.card .act { display: flex; gap: 8px; align-items: center; margin-top: 12px; } .card .act .hint { color: var(--dim2); font-size: 12px; margin-left: auto; }
.btn { background: var(--chip); border: 0; border-radius: 6px; padding: 5px 14px; color: var(--text); } .btn:hover { color: #fff; } .btn.go { background: var(--accent); color: var(--surface); font-weight: 600; } .btn:disabled { opacity: .4; cursor: default; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div id="log"><div id="inner">
  <div id="hello"><div class="mark">✻</div><div class="t">Claude Code</div><div id="hello-s">Starting…</div></div>
  <div id="live"></div>
  <div id="spin"><span class="g">✻</span><span class="v">Thinking…</span><span class="s"></span></div>
</div></div>
<div id="dock"><div id="dock-in">
  <button id="jump" hidden title="To the latest">↓</button>
  <div id="pop" hidden></div>
  <div id="banner" hidden><span id="banner-t"></span><button id="banner-x" title="Hide">×</button></div>
  <div id="ask"></div>
  <div id="composer">
    <div id="strip"></div>
    <textarea id="input" rows="1" placeholder="Starting…" spellcheck="false"></textarea>
    <div class="bar">
      <button class="ib" id="b-add" title="Add an image"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
      <button class="ib" id="b-slash" title="Commands"><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/><path d="M9.3 5.2 6.7 10.8"/></svg></button>
      <button class="chip" id="c-model" title="Model">Model</button>
      <button class="chip mode" id="c-mode" title="Permission mode"></button>
      <button id="send" title="Send (Enter)" disabled><svg viewBox="0 0 16 16"><path d="M8 13V3.5M3.8 7.5 8 3.3l4.2 4.2"/></svg></button>
    </div>
  </div>
  <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
</div></div>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
const TAB = (location.hash.match(/tab=([\w-]+)/) || [])[1] || '';
const post = (o) => { try { window.webkit.messageHandlers.mewo.postMessage(JSON.stringify({ ...o, tab: TAB })); } catch (e) { /* no window behind the page */ } };
const MAX_SHOWN = 30000;

const S = {
  cwd: '', model: '', mode: '', slash: [], models: [], turns: 0, startedAt: 0, state: 'starting', ended: false,
  tools: new Map(), asks: new Map(), queued: [], attach: [], liveKind: '', liveText: '', runningTool: '', status: '', thinkTokens: 0,
  lastErr: '', retryPending: false,
};
const log = $('log'), inner = $('inner'), live = $('live'), spin = $('spin'), input = $('input'), pop = $('pop'), askBox = $('ask'), composer = $('composer');

// ---------- text ----------
const rel = (p) => { p = String(p || ''); return S.cwd && p.startsWith(S.cwd + '/') ? p.slice(S.cwd.length + 1) : p; };
const looksLikePath = (c) => /^[\w.@~\-\/]+\.[A-Za-z0-9]{1,8}(:\d+(-\d+)?)?$/.test(c) || /^[\w.@~\-]+(\/[\w.@~\-\[\]]+)+\/?(:\d+)?$/.test(c);
function pathAttr(p) { const m = String(p).match(/^(.*?)(?::(\d+)(?:-\d+)?|#L(\d+)(?:-L?\d+)?)?$/); return `data-path="${esc(m[1])}"${m[2] || m[3] ? ` data-line="${m[2] || m[3]}"` : ''}`; }
const pathLink = (p) => `<code class="path" ${pathAttr(p)} title="${esc(p)}">${esc(rel(p))}</code>`;
function inline(s) {
  const codes = [];
  s = String(s).replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return `\u0001${codes.length - 1}\u0001`; });
  s = esc(s);
  s = s.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^https?:\/\//.test(u) ? `<a href="#" data-url="${u}">${t}</a>` : /^[a-z][a-z0-9+.-]*:/i.test(u) ? t : `<a href="#" ${pathAttr(u.replace(/&amp;/g, '&'))}>${t}</a>`);

      if (typeof c === 'string') { if (phone(c)) break; const m = c.match(/<local-command-stdout>([\s\S]*?)<\/local-command-stdout>/); if (m && m[1].trim()) addNote(m[1].trim().replace(/[`*]/g, '')); break; }

function fromWindow(ev) {

function limit(i) {

$('banner-x').onclick = () => { $('banner').hidden = true; };

// ---------- a prompt waiting for you ----------
function closeAsk(id) { if (S.asks.delete(id)) paintAsk(); }

// Claude's questions, one at a time: tabs for the questions when there are several, the options, your own answer.
function questionCard(id, r) {
  const qs = (r.input || {}).questions || [], n = qs.length, card = el('div', 'card');
  const picked = qs.map(() => new Set()), other = qs.map(() => ''); let cur = 0;
  const value = (qi) => { const labels = [...picked[qi]].sort((x, y) => x - y).map((oi) => qs[qi].options[oi].label), o = other[qi].trim(); return (qs[qi].multiSelect ? [...labels, ...(o ? [o] : [])] : o ? [o] : labels).join(', '); };

    <div class="act">${n > 1 ? '<button class="btn back">Back</button>' : ''}<button class="btn go"></button><button class="btn skip">Skip</button><span class="hint"></span></div>`;

  const paint = () => {

// ---------- the composer ----------
function ready() { if (S.ended) return; input.placeholder = S.turns ? 'Queue another message…' : 'Message Claude: @ for a file, / for a command'; }

}

// A list above the composer: files for "@", commands for "/", the model and the mode.
let popItems = [], popAt = 0, mentionQ = null;
function showPop(items, o) {

  pop.innerHTML = (o && o.head ? `<div class="hd">${esc(o.head)}</div>` : '') + items.map((it, k) => `<div class="it" data-k="${k}"><span class="n">${esc(it.n)}</span>${it.d ? `<span class="d">${esc(it.d)}</span>` : ''}${it.on ? '<span class="ck">✓</span>' : ''}</div>`).join('');
  pop.hidden = !items.length && !(o && o.head); paintPop();
  pop.querySelectorAll('.it').forEach((n) => { n.onmousedown = (e) => { e.preventDefault(); popItems[+n.dataset.k].pick(); }; n.onmousemove = () => { popAt = +n.dataset.k; paintPop(); }; });
}
function paintPop() { pop.querySelectorAll('.it').forEach((n, k) => { n.classList.toggle('on', k === popAt); if (k === popAt) n.scrollIntoView({ block: 'nearest' }); }); }

// ---------- clicks in the log ----------
document.addEventListener('click', (e) => {
